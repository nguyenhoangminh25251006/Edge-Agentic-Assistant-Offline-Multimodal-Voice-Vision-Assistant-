  speed:
    min_mms: null
    max_mms: null
    rated_mms: null
    require_unit: true
  tee:
    request_ttl_ms: 3000
    follow_ms: 15000
  breaker:
    failure_threshold: 3
    open_s_initial: 5
    open_s_max: 60
    canary_interval_s: 30
    canary_timeout_ms: 3000
