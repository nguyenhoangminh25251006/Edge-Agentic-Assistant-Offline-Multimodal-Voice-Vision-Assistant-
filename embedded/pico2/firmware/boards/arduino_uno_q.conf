# UNO Q (STM32U585) specifics.
# SysTick instead of LPTIM1 as the system timer (see arduino_uno_q.overlay), 10 kHz tick
# so the 5 ms control period is exactly 50 ticks.
CONFIG_STM32_LPTIM_TIMER=n
CONFIG_CORTEX_M_SYSTICK=y
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000

# No microphone driver for the STM32U585 yet (needs a Zephyr SAI/I2S version of
# voice/audio_in.h and a check that SAI pins reach a header, CH-103).
CONFIG_EAA_VOICE=n
